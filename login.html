<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Soil Fertility Prediction</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    body{
      font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background:linear-gradient(135deg,#f0fdf4 0%,#e0f2fe 100%);
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
      color:#1e293b;
    }
    .card{
      background:#fff;
      border-radius:16px;
      box-shadow:0 20px 40px rgba(0,0,0,0.12);
      padding:2rem;
      max-width:720px;
      width:100%;
      text-align:center;
    }
    .icon{
      width:72px;height:72px;border-radius:20px;
      background:linear-gradient(135deg,#22c55e,#16a34a);
      margin:0 auto 1rem;
      display:flex;align-items:center;justify-content:center;
      color:#fff;font-size:1.8rem;
    }
    h1{margin:0 0 .5rem;font-size:1.6rem;}
    p{margin:0 0 1.25rem;color:#64748b;line-height:1.7;}
    a{display:inline-flex;align-items:center;gap:.5rem;}
  </style>
</head>
<body>
  <div class="card">
    <div class="icon"><i class="fas fa-leaf"></i></div>
    <h1>Login & Registration Removed</h1>
    <p>
      The authentication (login/registration) pages and code have been removed from this front-end.
      Use the dashboard directly to run soil analysis and predictions.
    </p>
    <a class="btn btn-primary" href="dashboard.html"><i class="fas fa-arrow-right"></i> Go to Dashboard</a>
  </div>
</body>
</html>
